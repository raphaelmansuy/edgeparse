[package]
name = "edgeparse-node"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
edgeparse-core = { path = "../edgeparse-core" }
napi = { version = "2", features = ["napi4"] }
napi-derive = "2"
serde = { workspace = true }
serde_json = { workspace = true }

[build-dependencies]
napi-build = "2"
