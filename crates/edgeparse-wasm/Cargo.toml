[package]
name = "edgeparse-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "EdgeParse PDF parser — WebAssembly build for browsers"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
edgeparse-core = { path = "../edgeparse-core", default-features = false, features = ["wasm"] }
# Optional: enable with `--features ocr-ocrs` once models are loaded from JS.
# edgeparse-core ocr-ocrs pulls ocrs+rten (wasm32-ok).
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
console_error_panic_hook = "0.1"
console_log = { version = "1", features = ["color"] }
log = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
image = { workspace = true }

[features]
default = []
ocr-ocrs = ["edgeparse-core/ocr-ocrs"]

[dev-dependencies]
wasm-bindgen-test = "0.3"
