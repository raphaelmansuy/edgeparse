[package]
name = "edgeparse-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "EdgeParse core library — PDF parsing and structured data extraction"
readme = "README.md"
keywords = ["pdf", "extraction", "markdown", "rag", "llm"]
categories = ["text-processing", "parsing", "data-structures"]
documentation = "https://docs.rs/edgeparse-core"

[package.metadata.docs.rs]
features = ["hybrid"]
rustdoc-args = ["--cfg", "docsrs"]
all-features = false

[dependencies]
lopdf = { workspace = true, default-features = false, features = ["chrono", "jiff", "time"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
rayon = { workspace = true, optional = true }
image = { workspace = true, optional = true }
base64 = { workspace = true }
regex = { workspace = true }
unicode-normalization = { workspace = true }
indexmap = { workspace = true }
ordered-float = { workspace = true }
ttf-parser = { workspace = true }
euclid = { workspace = true }
zip = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
ocrs = { version = "0.13", optional = true }
rten = { version = "0.26", optional = true, default-features = false, features = ["rten_format"] }
rten-imageproc = { version = "0.26", optional = true }
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
hayro-jbig2 = { version = "0.3", optional = true, default-features = false, features = ["std"] }
jpeg2k = { version = "0.9", optional = true }

[features]
default = ["native"]
# Optional crate enablement (Cargo `dep:` form does not imply a feature of the same name).
image = ["dep:image"]
native = ["dep:rayon", "image", "dep:zip", "lopdf/rayon"]
wasm = ["lopdf/wasm_js", "image", "dep:js-sys", "dep:wasm-bindgen"]
hybrid = ["dep:reqwest", "dep:tokio"]
ocr-ocrs = ["dep:ocrs", "dep:rten", "dep:rten-imageproc", "image"]
# Optional PDF image codecs for the OCR path (scanned / hybrid pages).
codecs-jbig2 = ["dep:hayro-jbig2", "image"]
codecs-jpx = ["dep:jpeg2k", "image"]
codecs = ["codecs-jbig2", "codecs-jpx"]

[dev-dependencies]
