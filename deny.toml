# cargo-deny configuration
# Run: cargo deny check

[advisories]
# cargo-deny >= 0.17: vulnerability/notice/unsound removed (always errors);
# unmaintained now takes a scope: all | workspace | transitive | none
yanked = "warn"
unmaintained = "workspace"
# RUSTSEC-2025-0020: Risk of buffer overflow in pyo3's PyString::from_object.
# edgeparse-python does not call PyString::from_object so we are not affected.
ignore = ["RUSTSEC-2025-0020"]
unused-ignored-advisory = "allow"

[licenses]
# cargo-deny >= 0.17: unlicensed/deny/copyleft removed; all licenses denied unless in allow list
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "OpenSSL",
    "NCSA",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
