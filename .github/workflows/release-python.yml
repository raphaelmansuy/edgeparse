name: Release — Python (PyPI)

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  id-token: write
  contents: read

jobs:
  build-wheels:
    name: Build wheel — ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: auto
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            manylinux: auto
          - runner: macos-13
            target: x86_64-apple-darwin
            manylinux: ''
          - runner: macos-14
            target: aarch64-apple-darwin
            manylinux: ''
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: ''

    steps:
      - uses: actions/checkout@v4

      # Linux: maturin-action builds all Python versions automatically via
      # the manylinux container (cp310–cp313).
      # macOS: install multiple interpreters so maturin produces one wheel
      # per Python version per arch.
      - uses: actions/setup-python@v5
        if: ${{ !startsWith(matrix.platform.runner, 'ubuntu') }}
        with:
          python-version: |
            3.10
            3.11
            3.12
            3.13

      - uses: actions/setup-python@v5
        if: startsWith(matrix.platform.runner, 'ubuntu')
        with:
          python-version: '3.12'

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          working-directory: sdks/python
          args: >-
            --release --out dist/
            ${{ !startsWith(matrix.platform.runner, 'ubuntu') && '-i python3.10 python3.11 python3.12 python3.13' || '' }}
          sccache: 'true'

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform.target }}
          path: sdks/python/dist/

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install maturin
      - run: |
          cd sdks/python
          maturin sdist --out dist/
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: sdks/python/dist/

  publish-pypi:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
