name: Release — Node.js (npm)

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name to publish (e.g. v0.2.2) — used for version sync'
        required: true
        default: 'v0.2.2'

permissions:
  contents: write
  id-token: write   # required for npm Trusted Publisher (OIDC tokenless publish)

jobs:
  build-native:
    name: Build .node — ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            node-platform: linux-x64-gnu
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            node-platform: linux-arm64-gnu
            use-zigbuild: true
          - target: x86_64-apple-darwin
            runner: macos-latest
            node-platform: darwin-x64
          - target: aarch64-apple-darwin
            runner: macos-14
            node-platform: darwin-arm64
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            node-platform: win32-x64-msvc

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: '${{ matrix.target }}' }
      - uses: Swatinem/rust-cache@v2

      - name: Install zig + cargo-zigbuild (for aarch64 Linux cross)
        if: matrix.use-zigbuild
        run: |
          pip install ziglang
          cargo install cargo-zigbuild --locked

      - name: Build Rust binding
        run: |
          if [[ "${{ matrix.use-zigbuild }}" == "true" ]]; then
            cargo zigbuild --release --target ${{ matrix.target }}.2.17 -p edgeparse-node
          else
            cargo build --release --target ${{ matrix.target }} -p edgeparse-node
          fi
        shell: bash

      - name: Rename .node artifact
        shell: bash
        run: |
          TARGET="${{ matrix.target }}"
          if [[ "$TARGET" == *"windows"* ]]; then
            SRC="target/${TARGET}/release/edgeparse_node.dll"
          elif [[ "$TARGET" == *"apple"* ]]; then
            SRC="target/${TARGET}/release/libedgeparse_node.dylib"
          else
            SRC="target/${TARGET}/release/libedgeparse_node.so"
          fi
          DEST="sdks/node/npm/${{ matrix.node-platform }}/edgeparse-node.${{ matrix.node-platform }}.node"
          mkdir -p "sdks/node/npm/${{ matrix.node-platform }}"
          cp "$SRC" "$DEST"
          ls -la "$DEST"
          # upload-artifact respects .gitignore (*.node) — stage outside the repo tree.
          # Use RUNNER_TEMP (works on Windows; /tmp does not).
          STAGE="${RUNNER_TEMP}/edgeparse-node-artifact/${{ matrix.node-platform }}"
          mkdir -p "$STAGE"
          cp "$DEST" "$STAGE/"
          cp "sdks/node/npm/${{ matrix.node-platform }}/package.json" "$STAGE/"

      - uses: actions/upload-artifact@v4
        with:
          name: node-${{ matrix.node-platform }}
          path: ${{ runner.temp }}/edgeparse-node-artifact/${{ matrix.node-platform }}/
          if-no-files-found: error

  publish-npm:
    name: Publish to npm
    needs: build-native
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      # Do NOT set registry-url — dummy NODE_AUTH_TOKEN breaks Trusted Publisher.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/download-artifact@v4
        with:
          pattern: node-*
          path: /tmp/node-artifacts
          merge-multiple: false

      - name: Place platform binaries into npm package dirs
        run: |
          set -euo pipefail
          for d in /tmp/node-artifacts/node-*/; do
            platform=$(basename "$d" | sed 's/^node-//')
            dest="sdks/node/npm/${platform}"
            mkdir -p "$dest"
            cp "$d"/*.node "$dest/"
            # Keep checked-out package.json (version sync happens next); binary must be present
            ls -la "$dest"
            test -f "$dest/edgeparse-node.${platform}.node"
          done

      - name: Sync version
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
        run: |
          node -e "
          const fs = require('fs');
          const refName = process.env.INPUT_TAG_NAME || process.env.GITHUB_REF_NAME;
          const version = refName.replace(/^v/, '');
          const dirs = [
            'sdks/node',
            ...fs.readdirSync('sdks/node/npm').map(d => \`sdks/node/npm/\${d}\`)
          ];
          dirs.forEach(dir => {
            const p = \`\${dir}/package.json\`;
            if (fs.existsSync(p)) {
              const pkg = JSON.parse(fs.readFileSync(p, 'utf8'));
              // Update optionalDependencies versions
              Object.keys(pkg.optionalDependencies || {}).forEach(k => {
                pkg.optionalDependencies[k] = version;
              });
              pkg.version = version;
              fs.writeFileSync(p, JSON.stringify(pkg, null, 2) + '\n');
            }
          });
          console.log('Version synced to: ' + version);
          "

      - run: |
          cd sdks/node
          npm ci
          npm run build:ts

      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
        run: |
          TAG_NAME="${INPUT_TAG_NAME:-$GITHUB_REF_NAME}"
          gh release view "$TAG_NAME" --repo "${{ github.repository }}" \
          || gh release create "$TAG_NAME" \
               --repo "${{ github.repository }}" \
               --title "$TAG_NAME" \
               --generate-notes

      - name: Pack npm tarballs
        run: |
          set -euo pipefail
          mkdir -p release-assets/node
          for dir in sdks/node/npm/*/; do
            platform=$(basename "$dir")
            test -f "$dir/edgeparse-node.${platform}.node" \
              || { echo "Missing binary in $dir"; ls -la "$dir"; exit 1; }
            (cd "$dir" && npm pack --pack-destination "$GITHUB_WORKSPACE/release-assets/node")
          done
          (cd sdks/node && npm pack --pack-destination "$GITHUB_WORKSPACE/release-assets/node")
          ls -la release-assets/node/

      - name: Upload npm tarballs to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
        run: |
          TAG_NAME="${INPUT_TAG_NAME:-$GITHUB_REF_NAME}"
          gh release upload "$TAG_NAME" release-assets/node/*.tgz \
            --repo "${{ github.repository }}" --clobber

      - name: Publish platform packages
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN || true
          publish_dir() {
            (cd "$1" && npm publish --provenance --access public --registry https://registry.npmjs.org)
          }
          for dir in sdks/node/npm/*/; do
            NAME=$(node -p "require('./${dir}package.json').name")
            VER=$(node -p "require('./${dir}package.json').version")
            if publish_dir "$dir"; then
              echo "Published $NAME@$VER via OIDC"
              continue
            fi
            if npm info "${NAME}@${VER}" version >/dev/null 2>&1; then
              echo "::warning::$NAME@$VER already published — skipping."
              continue
            fi
            if [[ -n "${NPM_TOKEN:-}" ]]; then
              echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
              if publish_dir "$dir"; then
                echo "Published $NAME@$VER via NPM_TOKEN"
                continue
              fi
              if npm info "${NAME}@${VER}" version >/dev/null 2>&1; then
                echo "::warning::$NAME@$VER already published — skipping."
                continue
              fi
            fi
            echo "::warning::npm publish unavailable for $NAME — keeping the tarball on the GitHub Release instead."
          done

      - name: Publish edgeparse (main package)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN || true
          cd sdks/node
          VER=$(node -p "require('./package.json').version")
          publish() { npm publish --provenance --access public --registry https://registry.npmjs.org; }
          if publish; then
            echo "Published edgeparse@$VER via OIDC"
            exit 0
          fi
          if npm info "edgeparse@${VER}" version >/dev/null 2>&1; then
            echo "edgeparse@$VER already published — skipping."
            exit 0
          fi
          if [[ -n "${NPM_TOKEN:-}" ]]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
            if publish; then
              echo "Published edgeparse@$VER via NPM_TOKEN"
              exit 0
            fi
            if npm info "edgeparse@${VER}" version >/dev/null 2>&1; then
              echo "edgeparse@$VER already published — skipping."
              exit 0
            fi
          fi
          echo "::warning::npm publish unavailable for edgeparse — keeping the tarball on the GitHub Release instead."
